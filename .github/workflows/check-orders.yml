name: Auto Review @pora7307 Orders

on:
  push:
    branches:
      - main
    paths:
      - "orders/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate orders and generate replies
        run: python3 scripts/check_order.py

      - name: Commit and push replies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add replies/
          if git diff --staged --quiet; then
            echo "No changes to replies/"
          else
            git commit -m "chore: auto-review orders and update replies"
            git push
          fi
